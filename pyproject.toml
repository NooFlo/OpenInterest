[project]
name = "openinterest"
version = "0.1.0"
description = "Self-hosted, ad-free Pinterest-grade visual discovery: pins, boards, multi-signal 'more like this', faceted search sessions, and an agent API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "timm>=1.0",
    "qdrant-client>=1.9",
    "transformers>=4.40",
]
dev = ["pytest>=8.0", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
