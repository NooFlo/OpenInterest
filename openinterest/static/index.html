<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenInterest</title>
<style>
  :root { --bg:#101014; --card:#191922; --text:#e8e8ee; --dim:#9a9aa8; --accent:#e84a5f; --chip:#26263a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:10; background:rgba(16,16,20,.96); border-bottom:1px solid #26262f; padding:12px 20px; display:flex; flex-direction:column; gap:8px; }
  .searchrow { display:flex; gap:10px; }
  #q { flex:1; background:var(--card); border:1px solid #2c2c3a; color:var(--text); border-radius:22px; padding:11px 18px; font-size:16px; }
  #q:focus { outline:1px solid var(--accent); }
  button { background:var(--card); color:var(--text); border:1px solid #2c2c3a; border-radius:18px; padding:8px 16px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border:none; font-weight:600; }
  .chipsrow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; min-height:26px; }
  .crumb { background:var(--chip); border-radius:12px; padding:3px 10px; font-size:13px; cursor:pointer; }
  .crumb b { color:var(--accent); font-weight:500; margin-right:4px; font-size:11px; text-transform:uppercase; }
  .crumb.sugg { border:1px dashed #3a3a52; color:var(--dim); }
  .crumb.sugg:hover { color:var(--text); border-color:var(--accent); }
  .hint { color:var(--dim); font-size:12px; }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select { background:var(--card); color:var(--text); border:1px solid #2c2c3a; border-radius:16px; padding:7px 12px; }
  main { columns:4 240px; column-gap:14px; padding:20px; }
  .card { background:var(--card); border-radius:10px; margin-bottom:14px; break-inside:avoid; position:relative; overflow:hidden; cursor:pointer; border:1px solid transparent; }
  .card:hover { border-color:var(--accent); }
  .card img { width:100%; display:block; min-height:40px; background:#22222e; }
  .card .meta { padding:7px 10px; font-size:12px; color:var(--dim); display:flex; justify-content:space-between; gap:6px; }
  .card.sel { outline:2px solid var(--accent); }
  .xbtn { position:absolute; top:6px; right:6px; background:rgba(0,0,0,.6); border:none; border-radius:50%; width:24px; height:24px; display:none; }
  .card:hover .xbtn { display:block; }
  .msg { padding:40px; text-align:center; color:var(--dim); }
  #err { color:#ff8090; padding:10px 20px; display:none; }
  main.hidden { display:none; }
  #swipe { display:none; flex-direction:column; align-items:center; gap:12px; padding:24px 16px; }
  #swipe.on { display:flex; }
  .scard { position:relative; width:min(94vw, 420px); aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:var(--card); touch-action:none; user-select:none; cursor:grab; border:1px solid #2c2c3a; }
  .scard img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .scard .verdict { position:absolute; top:16px; font:800 34px system-ui; padding:2px 12px; border:4px solid; border-radius:10px; opacity:0; transition:opacity .12s; }
  .scard .verdict.yes { left:14px; color:#7ef29d; border-color:#7ef29d; transform:rotate(-12deg); }
  .scard .verdict.no { right:14px; color:#ff8090; border-color:#ff8090; transform:rotate(12deg); }
  .scard .slide-yes { opacity:1; } .scard .slide-no { opacity:1; }
  .sbtns { display:flex; gap:40px; }
  .sbtn { width:64px; height:64px; border-radius:50%; font-size:26px; border:2px solid; background:var(--card); color:inherit; }
  .sbtn.no { color:#ff8090; border-color:#ff8090; }
  .sbtn.yes { color:#7ef29d; border-color:#7ef29d; }
  .sverdict { color:var(--dim); font-size:13px; min-height:18px; text-align:center; }
</style>
</head>
<body>
<header>
  <div class="searchrow">
    <input id="q" placeholder="Search — start with a folder (board) or type anything; the bar fills in with what the session thinks you're looking for">
    <button id="btn-search" class="primary">Search</button>
    <button id="btn-swipe" title="one image at a time — swipe to refine">☰ Swipe</button>
    <button id="btn-web">Deep web search</button>
  </div>
  <div class="controls">
    <select id="boards"><option value="">— start from folder —</option></select>
    <button id="btn-board">Start session</button>
    <span class="hint">Click an image = “this is interesting” (refines the query) · ✕ = not interesting · chips below are suggested terms you can adopt</span>
  </div>
  <div class="chipsrow" id="crumbs"></div>
  <div class="chipsrow" id="sugg"></div>
  <div id="err"></div>
</header>
<main id="grid"></main>
<div id="swipe">
  <div class="sverdict" id="sverdict"></div>
  <div class="scard" id="scard">
    <img id="simg" alt="">
    <span class="verdict yes" id="vyes">LIKE</span>
    <span class="verdict no" id="vno">NOPE</span>
  </div>
  <div class="sbtns">
    <button class="sbtn no" id="sbtn-no" title="not interesting">✕</button>
    <button class="sbtn yes" id="sbtn-yes" title="interesting — refine the query">♥</button>
  </div>
  <div class="hint">Swipe right = interesting (refines the query) · left = not interesting</div>
  <button onclick="toggleSwipe(false)">Done — back to grid</button>
</div>

<div class="msg" id="msg">No session yet — pick a folder above, or type a query and hit Search.</div>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let pinMeta = {};   // pin_id -> {image_url, title, tags}

function renderCards(items) {
  const grid = $("grid"), msg = $("msg");
  grid.innerHTML = "";
  msg.style.display = items.length ? "none" : "block";
  msg.textContent = "Nothing found yet — start from a folder or another query.";
  for (const it of items) {
    const pinId = it.pin_id || it.id;
    const url = it.image_url || (pinMeta[pinId] || {}).image_url;
    if (!url) continue;
    const card = document.createElement("div");
    card.className = "card" + (it.selected ? " sel" : "");
    card.innerHTML = `
      <button class="xbtn" title="not interesting">✕</button>
      <img loading="lazy" src="${url}">
      <div class="meta"><span>${((pinMeta[pinId]||{}).title || "").slice(0,42)}</span><span>${it.score ? it.score.toFixed(2) : ""}</span></div>`;
    card.onclick = () => selectPin(pinId);
    card.querySelector(".xbtn").onclick = (e) => { e.stopPropagation(); dismissPin(pinId); };
    grid.appendChild(card);
  }
}

async function setQuery(prefix) {
  try {
    const r = await api("GET", `/sessions/${sessionId}/query`);
    $("q").value = r.query;
    renderCrumbs(r.breadcrumb);
  } catch (e) { /* no session yet */ }
  if (!sessionId && prefix !== undefined) $("q").value = prefix;
}

function renderCrumbs(breadcrumbText) {
  const row = $("crumbs");
  row.innerHTML = "";
  (breadcrumbText || "").split(" · ").filter(Boolean).forEach((val) => {
    const el = document.createElement("span");
    el.className = "crumb";
    el.innerHTML = `<b>searching</b>${val}`;
    el.title = "click to remove this facet";
    el.onclick = async () => { removeFacet(val); };
    row.appendChild(el);
  });
}

async function removeFacet(value) {
  const doc = await api("GET", `/sessions/${sessionId}/query`);
  for (const [facet, f] of Object.entries(doc.facets || {})) {
    if (f.value === value) await api("PATCH", `/sessions/${sessionId}/facets/${facet}`, { value: null });
  }
  await refresh();
}

async function loadSugg() {
  if (!sessionId) { $("sugg").innerHTML = ""; return; }
  const doc = await api("GET", `/sessions/${sessionId}/chips`);
  const row = $("sugg");
  row.innerHTML = "";
  doc.chips.forEach((c) => {
    const el = document.createElement("span");
    el.className = "crumb sugg";
    el.textContent = `+ ${c.value}`;
    el.title = `appears in ${c.count} nearby images — click to adopt`;
    el.onclick = async () => { await api("POST", `/sessions/${sessionId}/chips`, { facet: "style", value: c.value }); await refresh(); };
    row.appendChild(el);
  });
}

async function refresh() {
  if (!sessionId) return;
  const local = await api("POST", `/sessions/${sessionId}/search`);
  const items = local.results;
  for (const it of items) if (!pinMeta[it.pin_id]) pinMeta[it.pin_id] = await api("GET", `/pins/${it.pin_id}`);
  renderCards(items.map((it) => ({ ...it, selected: true })));
  await setQuery();
  await loadSugg();
}

async function selectPin(pinId) {
  if (!sessionId) sessionId = (await api("POST", "/sessions", { seed_pin_ids: [pinId] })).id;
  else await api("POST", `/sessions/${sessionId}/select?pin_id=${pinId}`, {});
  await refresh();
}

async function dismissPin(pinId) {
  if (!sessionId) return;
  await api("POST", `/sessions/${sessionId}/dismiss`, { pin_id: pinId });
  await refresh();
}

async function startFromBoard() {
  const boardId = $("boards").value;
  if (!boardId) return;
  const sess = await api("POST", "/sessions", { board_id: boardId });
  sessionId = sess.id;
  await refresh();
}

async function textSearch() {
  const query = $("q").value.trim();
  if (!query) return;
  try {
    const doc = await api("POST", "/search/text", { query });
    for (const r of doc.results) if (!pinMeta[r.pin_id] && r.image_url) pinMeta[r.pin_id] = { image_url: r.image_url, title: "" };
    renderCards(doc.results);
  } catch (e) {
    $("msg").style.display = "block";
    $("msg").textContent = "Text search needs local models installed (`pip install -e .[ml]`). Start from a folder instead, or run the agent API.";
  }
}

async function webSearch() {
  if (!sessionId) { $("err").textContent = "Start a session first (pick a folder or click an image)."; $("err").style.display = "block"; return; }
  $("err").style.display = "none";
  $("msg").style.display = "block";
  $("msg").textContent = "Searching the open web with the current query assumption…";
  try {
    const doc = await api("POST", `/sessions/${sessionId}/web`);
    const items = doc.results.map((r) => ({ pin_id: `web-${r.source_id || Math.random().toString(36).slice(2)}`, image_url: r.image_url, score: r.score, selected: false }));
    renderCards(items);
  } catch (e) {
    $("msg").textContent = e.message.includes("embeddings unavailable")
      ? "Web tier needs local embeddings (`pip install -e .[ml]`)."
      : "Web search failed: " + e.message;
  }
}

async function api(method, url, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body || {});
  const resp = await fetch(url, opts);
  if (!resp.ok) {
    const t = await resp.text();
    throw new Error((t || resp.statusText) + "");
  }
  return resp.json();
}


// ---- swipe mode -------------------------------------------------------
let swipeQueue = [];
let swipeIdx = 0;

function overQueryTerm(t) {
  // a broad first-level term from whatever the user typed: keep the first 1-2 words
  if (!t) return "";
  return t.toLowerCase().split(/\s+/).slice(0, 2).join(" ");
}

function toggleSwipe(on) {
  const want = on !== undefined ? on : !$("swipe").classList.contains("on");
  $("swipe").classList.toggle("on", want);
  $("grid").classList.toggle("hidden", want);
  $("msg").style.display = "none";
  if (want) startSwipe();
}

async function startSwipe() {
  swipeQueue = []; swipeIdx = 0;
  if (!sessionId) {
    let body = {};
    if ($("boards").value) body = { board_id: $("boards").value };
    else { const term = overQueryTerm($("q").value.trim()); if (term) body = { initial_query: term }; }
    const sess = await api("POST", "/sessions", body);
    sessionId = sess.id;
  }
  await fillSwipeQueue();
  renderSwipeCard();
}

async function fillSwipeQueue() {
  const local = await api("POST", `/sessions/${sessionId}/search`);
  const items = [];
  for (const r of local.results) {
    if (!pinMeta[r.pin_id]) pinMeta[r.pin_id] = await api("GET", `/pins/${r.pin_id}`);
    if (pinMeta[r.pin_id].image_url) items.push({ pin_id: r.pin_id, image_url: pinMeta[r.pin_id].image_url });
  }
  if (items.length) {
    swipeQueue = items; swipeIdx = 0;
  } else {
    $("sverdict").textContent = "No more local results — extending to the open web with the current query…";
    try {
      const web = await api("POST", `/sessions/${sessionId}/web`);
      swipeQueue = web.results.map((r) => ({ web: true, pin_id: null, image_url: r.image_url, title: r.title, creator: r.creator, source_url: r.source_url }));
      $("sverdict").textContent = swipeQueue.length ? "" : "No web results for this query yet — select a few local images first.";
    } catch (e) { swipeQueue = []; $("sverdict").textContent = "Web tier unavailable (needs local embeddings). Swipe on local results first."; }
    swipeIdx = 0;
  }
  await setQuery();
}

function renderSwipeCard() {
  const card = swipeQueue[swipeIdx];
  if (!card) {
    $("simg").removeAttribute("src");
    if (!$("sverdict").textContent) $("sverdict").textContent = "That's everything for this query — adjust the search bar and swipe again.";
    return;
  }
  $("simg").src = card.image_url;
  if (!card.web) $("sverdict").textContent = "";
  resetDrag();
}

async function swipe(dir) {
  const card = swipeQueue[swipeIdx];
  if (!card) return;
  if (dir === "yes") {
    if (card.web) {
      const pinned = await api("POST", "/pins", { image_url: card.image_url, source_url: card.source_url || "", title: card.title || "", index_now: false });
      await api("POST", `/sessions/${sessionId}/select?pin_id=${pinned.id}`, {});
      pinMeta[pinned.id] = pinned;
    } else {
      await api("POST", `/sessions/${sessionId}/select?pin_id=${card.pin_id}`, {});
    }
  } else if (!card.web) {
    await api("POST", `/sessions/${sessionId}/dismiss`, { pin_id: card.pin_id });
  }
  swipeIdx++;
  if (swipeIdx >= swipeQueue.length) await fillSwipeQueue();
  else renderSwipeCard();
  await setQuery();    // the search bar now shows the refined query assumption
  await loadSugg();
}

// swipe gestures (pointer events: touch + mouse)
let drag = null;
const scard = $("scard");
function resetDrag() { scard.style.transition = "transform .2s"; scard.style.transform = ""; $("vyes").className = "verdict yes"; $("vno").className = "verdict no"; }
scard.addEventListener("pointerdown", (e) => { scard.setPointerCapture(e.pointerId); drag = { x: e.clientX }; scard.style.transition = ""; });
scard.addEventListener("pointermove", (e) => {
  if (drag === null) return;
  const dx = e.clientX - drag.x;
  scard.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)";
  $("vyes").className = "verdict yes" + (dx > 40 ? " slide-yes" : "");
  $("vno").className = "verdict no" + (dx < -40 ? " slide-no" : "");
});
scard.addEventListener("pointerup", (e) => {
  if (drag === null) return;
  const dx = e.clientX - drag.x; drag = null;
  if (dx > 90) swipe("yes"); else if (dx < -90) swipe("no"); else resetDrag();
});
$("sbtn-yes").onclick = () => swipe("yes");
$("sbtn-no").onclick = () => swipe("no");
$("btn-swipe").onclick = () => toggleSwipe();

async function init() {
  $("btn-search").onclick = textSearch;
  $("btn-web").onclick = webSearch;
  $("btn-board").onclick = startFromBoard;
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") textSearch(); });
  try {
    const pins = await api("GET", "/pins?limit=200");
    for (const p of pins) pinMeta[p.id] = p;
    renderCards(pins.map((p) => ({ id: p.id, image_url: p.image_url, score: 0 })));
    const boards = await api("GET", "/boards");
    for (const b of boards) $("boards").appendChild(new Option(b.name, b.id));
  } catch (e) { console.error(e); }
}
init();
</script>
</body>
</html>
